<!DOCTYPE html>
<html>
<head>
    <title>BankCore Legacy System - Member Search</title>
</head>
<body>
    <table width="100%" border="0" cellpadding="10">
        <tr>
            <td>
                <h2>BankCore Legacy System v2.3</h2>
            </td>
            <td align="right">
                <a href="/logout">Logout</a>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <table border="1" cellpadding="8" cellspacing="0" width="400">
                    <tr>
                        <td bgcolor="#cccccc" colspan="2" align="center">
                            <b>MEMBER SEARCH</b>
                        </td>
                    </tr>

                    {% if error %}
                    <tr>
                        <td colspan="2" align="center" style="color:red;">
                            {{ error }}
                        </td>
                    </tr>
                    {% endif %}

                    <form method="POST" action="/search">
                    <tr>
                        <td>Member ID:</td>
                        <td><input type="text" name="member_id" placeholder="Enter Member ID"></td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <input type="submit" value="Search Member">
                        </td>
                    </tr>
                    </form>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
